{% extends "base.html" %}
<!-- Формируется из локации и даты -->
{% block title %}{{post.location}}. {{post.date}}{% endblock title %}

{% block main %}
<main>
  <div class="container py-5">
    <article>
      <ul>
        <li>
          Место: {{post.location}}              
        </li>
        <li>
          Дата: {{post.date}}
        </li>
        <li>
          Категория: <a href="{% url "blog:category_posts" post.category %}">{{post.category}}</a>
        </li>
      </ul>         
      <p>
        {{post.text}}
      </p>          
    </article>                
  </div>
</main>
{% endblock main %}
